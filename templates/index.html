<!DOCTYPE html>
<html>

<head>

    <title>Chess Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .loading-popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-content {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            min-width: 320px;
        }

        .spinner {
            width: 55px;
            height: 55px;
            margin: 0 auto 20px;
            border: 5px solid #ddd;
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .analysis-choice {
            margin: 20px 0;
            text-align: center;
        }

        .analysis-choice label {
            margin: 0 15px;
            font-weight: bold;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 10px;
            border-radius: 8px;
            resize: vertical;
            font-size: 14px;
            box-sizing: border-box;
        }

        #fen-section {
            display: none;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>♟ Chess Analyzer</h1>

        <p class="subtitle">
            Analyze complete chess games (PGN) or individual positions (FEN) using Stockfish.
        </p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form id="uploadForm" action="/analyze" method="POST" enctype="multipart/form-data">

            <div class="analysis-choice">
                <label>
                    <input type="radio" name="analysis_type" value="pgn" checked>
                    PGN Game
                </label>

                <label>
                    <input type="radio" name="analysis_type" value="fen">
                    FEN Position
                </label>
            </div>

            <!-- PGN Upload -->
            <div id="pgn-section">
                <input id="pgn-input" type="file" name="pgn" accept=".pgn" required>
            </div>

            <!-- FEN Input -->
            <div id="fen-section">
                <textarea id="fen-input" name="fen" placeholder="Paste your FEN position here..."></textarea>
            </div>

            <br>

            <label for="engine-depth">Stockfish Depth</label>
            <input id="engine-depth" type="number" name="engine_depth" min="1" max="30" value="{{ engine_depth }}"
                required>

            <br><br>

            <button type="submit">
                Analyze
            </button>

            <center>
                <p>Please keep the max depth below 10.</p>
            </center>

        </form>

    </div>

    <!-- Loading Popup -->
    <div id="loadingPopup" class="loading-popup">
        <div class="loading-content">
            <div class="spinner"></div>
            <h2>Analyzing...</h2>
            <p>Please wait.<br>This may take a few moments depending on the selected depth.</p>
        </div>
    </div>

    <script>
        const pgnSection = document.getElementById("pgn-section");
        const fenSection = document.getElementById("fen-section");

        const pgnInput = document.getElementById("pgn-input");
        const fenInput = document.getElementById("fen-input");

        document.querySelectorAll('input[name="analysis_type"]').forEach(radio => {

            radio.addEventListener("change", function () {

                if (this.value === "pgn") {
                    pgnSection.style.display = "block";
                    fenSection.style.display = "none";

                    pgnInput.required = true;
                    fenInput.required = false;

                } else {

                    pgnSection.style.display = "none";
                    fenSection.style.display = "block";

                    pgnInput.required = false;
                    fenInput.required = true;
                }

            });

        });

        document.getElementById("uploadForm").addEventListener("submit", function () {

            document.getElementById("loadingPopup").style.display = "flex";

            const btn = this.querySelector("button");
            btn.disabled = true;
            btn.innerText = "Analyzing...";

        });
    </script>

</body>

</html>
