<!DOCTYPE html>
<html>

<head>

    <title>Chess Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>♟ Chess Analyzer</h1>

        <p class="subtitle">
            Upload your PGN file and let Stockfish analyze your game.
        </p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}

        <form action="/analyze" method="POST" enctype="multipart/form-data">

            <input type="file" name="pgn" accept=".pgn" required>

            <label for="engine-depth">Stockfish depth</label>
            <input id="engine-depth" type="number" name="engine_depth" min="1" max="30" value="{{ engine_depth }}" required>

            <br><br>

            <button type="submit">
                Analyze Game
            </button>

        </form>

    </div>

</body>

</html>
